<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-labelledby="title desc">
  <title id="title">De la comanda a cocina</title>
  <desc id="desc">TPV: Registra el pedido. API de Grill: Guarda en PostgreSQL. Cocina: Recibe cambios. Supabase Realtime distribuye eventos. El puente de impresión consulta la API.</desc>
  <rect width="760" height="228" fill="#edf3fb"/>
  <g font-family="system-ui, sans-serif">
    <text x="26" y="43" fill="#203149" font-size="23" font-weight="700">De la comanda a cocina</text>
    <path d="M226 113h52m-8-6 8 6-8 6m212-6h52m-8-6 8 6-8 6" fill="none" stroke="#356cb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="70" width="200" height="86" fill="#fff" stroke="#7d8fa7"/>
    <text x="41" y="107" fill="#203149" font-size="22" font-weight="700">TPV</text>
    <text x="41" y="132" fill="#40516a" font-size="15">Registra el pedido</text>
    <rect x="280" y="70" width="200" height="86" fill="#fff" stroke="#7d8fa7"/>
    <text x="295" y="107" fill="#203149" font-size="22" font-weight="700">API de Grill</text>
    <text x="295" y="132" fill="#40516a" font-size="15">Guarda en PostgreSQL</text>
    <rect x="534" y="70" width="200" height="86" fill="#fff" stroke="#7d8fa7"/>
    <text x="549" y="107" fill="#203149" font-size="22" font-weight="700">Cocina</text>
    <text x="549" y="132" fill="#40516a" font-size="15">Recibe cambios</text>
    <text x="26" y="194" fill="#40516a" font-size="15">Supabase Realtime distribuye eventos. El puente de impresión consulta la API.</text>
  </g>
</svg>
